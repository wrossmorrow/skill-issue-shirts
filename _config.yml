title: Skill Issue Shirts
tagline: Made by machines, with us putting in very little effort.
description: Small-batch shirts designed quickly from poorly thought out ideas.
url: "https://skill-issue-shirts.com"
baseurl: ""

collections:
  shirts:
    output: true
    permalink: /shirts/:name/

defaults:
  - scope:
      path: ""
      type: shirts
    values:
      layout: shirt
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts/
  - terraform/
  - _to_delete/
  - vendor/
